before_test:
- ver
- node --version
- npm --version

build: false

clone_depth: 1

environment:
  matrix:
  - nodejs_version: "23"
  - nodejs_version: "25"

image: Visual Studio 2022

install:
- ps: Install-Product node $env:nodejs_version
- npm install

platform: x64

test_script:
- npm run lint
- npm test
